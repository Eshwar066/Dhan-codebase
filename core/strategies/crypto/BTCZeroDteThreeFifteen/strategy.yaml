documentation:
  title: BTC Zero DTE
  overview: >
    Delta BTC same-day OTM short strangle (~$100 premium), 100% stop-loss per leg,
    one re-entry per leg, flat at 17:15 IST.
  rules: |
    - 15:15 IST: sell 10 OTM Call lots + 10 OTM Put lots (premium band ~50–110)
    - After MAIN fill: broker SL at 2x entry premium (100% stop)
    - One re-entry per leg at same premium band after SL
    - Manage remaining leg independently
    - 17:15 IST: exit all remaining MAIN positions
    - Scheduled slots; backtest uses 5m bars for clock alignment
  run_command: python -m run.main --engine-id delta_engine_one
  generate_readme: false
subscriptions:
  BarClosed: false
  ScheduledSlot:
    enabled: true
    symbols:
    - BTCUSD
execution:
  bracket_leg_tags:
  - MAIN_SL
