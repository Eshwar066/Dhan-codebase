documentation:
  title: BTC OTM10 + OTM15 Overnight (11PM)
  overview: >
    Delta BTC OTM10 and OTM15 short strangles on Daily expiry at 23:15 IST.
    SL re-entry at cost is declared via reentry_at_cost and executed by OMS.
  rules: |
    - 23:15 IST: sell OTM10 and OTM15 CE/PE
    - After MAIN fill: broker SL at 2x entry premium
    - Declare reentry_at_cost; OMS polls every 5m until expiry (up to 2 re-entries)
    - Once that strike is open again, OMS stops the retry
    - 17:15 IST: exit remaining MAIN positions
  run_command: python -m run.main --engine-id delta_engine_one
  generate_readme: false
subscriptions:
  BarClosed: false
  ScheduledSlot:
    enabled: true
    symbols:
    - BTCUSD
execution:
  bracket_leg_tags:
