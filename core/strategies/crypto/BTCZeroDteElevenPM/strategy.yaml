documentation:
  title: BTC OTM15 Overnight (11PM)
  overview: >
    Delta BTC OTM15 short strangle on Daily (0DTE) expiry. Enter 23:00 IST,
    100% stop-loss per leg, up to two re-entries at cost after SL, flat at 17:15 IST.
  rules: |
    - 23:00 IST: sell 1 OTM15 Call + 1 OTM15 Put (same-day Daily expiry)
    - After MAIN fill: broker SL at 2x entry premium (100% stop)
    - Up to 2 re-entries per leg at OTM15 after SL
    - Manage remaining leg independently
    - 17:15 IST: exit all remaining MAIN positions (overnight hold)
    - Scheduled slots; backtest uses 5m bars for clock alignment
  run_command: python -m run.main --engine-id delta_engine_one
  generate_readme: false
