documentation:
  title: ETH Zero DTE Reverse Straddle
  overview: ETH Daily Expiry Reverse Straddle (short strangle) on 15m candles. Entry at 12:00 PM IST, exit at 5:00 PM IST.
  rules: |
    - 12:00 PM IST: Buy ATM CE + Buy ATM PE, Sell OTM CE (80 pts) + Sell OTM PE (80 pts)
    - All legs: 1 lot each
    - 5:00 PM IST: Exit all positions (time-based)
    - Uses daily (0DTE) expiry
  run_command: python -m run.main --engine-id delta_engine_one