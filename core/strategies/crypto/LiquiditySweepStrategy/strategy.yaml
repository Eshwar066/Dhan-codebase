id: LiquiditySweepStrategy
implementation:
  module: core.strategies.crypto.LiquiditySweepStrategy.LiquiditySweepStrategy
  class: LiquiditySweepStrategy
instrument: FUTURE
allowed_modes:
- BACKTEST
- PAPER
- LIVE
broker:
  venue: DELTA
  api: DELTA
  delta:
    india: true
    testnet: false
    leverage: 5
symbols:
- BTCUSD
exchange: NSE
timeframe: '5'
params:
  # high zone sweep → SHORT; low zone sweep → LONG
  enable_high_entries: true
  enable_low_entries: false
  # true → swing_4h only; false → prev_4h + swing_4h
  enable_swing_mode: true
  # entry bar size: "1" (1m) or "5" (5m) — also set top-level timeframe / backtest TF
  entry_timeframe: '5'
schedule:
  eval_mode: live_feed
data:
  default:
    data: {}
profile:
  live:
    exchange: DELTA
    sector: 'YES'
  backtest:
    start_date: '2026-07-24'
    end_date: '2026-08-01'
    timeframe: '5'
    exchange: DELTA
    sector: 'YES'
dependencies:
  mixins:
  - MarketStructureMixin
  - IndiaMktMixins
  meta_key: liquidity_sweep
subscriptions:
  BarClosed:
    enabled: true
    timeframes:
    - '1'
    - '5'
    - 4h
    symbols:
    - BTCUSD
  ScheduledSlot:
    enabled: false
    symbols:
    - BTCUSD
  QuoteUpdated:
    enabled: false
    symbols:
    - BTCUSD
  IntentCreated: true
  IntentFilled: true
  PositionClosed: true
  FeedDisconnected: true
  FeedRecovered: true
documentation:
  title: Liquidity Sweep
  overview: Delta crypto 4H liquidity zones swept on 1m or 5m; enter when price trades back inside.
